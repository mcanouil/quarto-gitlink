platforms:
  listuser:
    display-name: Forge
    base-url: https://forge.example.org
    patterns:
      issue:
        - "#(%d+)"
        - "([^/]+/[^/#]+)#(%d+)"
      merge-request:
        - "!(%d+)"
        - "([^/]+/[^/#]+)!(%d+)"
      commit:
        - "^(%x+)$"
        - "([^/]+/[^/@]+)@(%x+)"
        - "(%w+)@(%x+)"
      user:
        - "@([%w]+)"
    url-formats:
      issue: "/{repo}/issues/{number}"
      merge-request: "/{repo}/merge_requests/{number}"
      pull: "/{repo}/merge_requests/{number}"
      commit: "/{repo}/commit/{sha}"
      user: "/{username}"
